# XcodeGen project definition for VoiceInbox.
#
# This file is the source of truth for the Xcode project. The generated
# `VoiceInbox.xcodeproj` is intentionally NOT committed (see .gitignore).
#
# To generate / regenerate the Xcode project on a Mac:
#
#     brew install xcodegen   # one time
#     xcodegen generate
#     open VoiceInbox.xcodeproj
#
# Then set your Apple Developer team and a unique bundle id prefix in
# Xcode's signing settings (or in Secrets.xcconfig) before running on device.

name: HearIt

options:
  bundleIdPrefix: com.aviashkenazi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "25"
    DEVELOPMENT_TEAM: "" # <- set your team id here or in Xcode signing.

targets:

  # ---------------------------------------------------------------------------
  # iPhone / iPad app
  # ---------------------------------------------------------------------------
  HearIt:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.voiceinbox
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/VoiceInbox.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad (iPad uses a dedicated split layout; UIRequiresFullScreen opts out of multitasking so all-orientations isn't required)
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        # Tell the asset-catalog compiler which set is the app icon; without this
        # no icon (or CFBundleIconName) is emitted and App Store upload fails.
        # This is the default (Release / TestFlight / App Store) icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Local Debug builds use a distinct icon (AppIcon-Dev) so they're easy to
        # tell apart from the TestFlight build on the home screen. Release inherits
        # the base "AppIcon" above.
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
    dependencies:
      - target: VoiceInboxWatch
        embed: true
      - target: ShareExtension
        embed: true

  # ---------------------------------------------------------------------------
  # Share Extension: save web links from Safari/Feedly to listen offline
  # ---------------------------------------------------------------------------
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      # Compile just the minimal shared sources the extension needs (it only
      # writes a pending stub to the app group; no fetch/extract/UI).
      - path: Shared/Services/AppGroup.swift
      - path: Shared/Services/JSONCoders.swift
      - path: Shared/Services/SavedArticleStorage.swift
      - path: Shared/Models/SavedArticle.swift
      - path: Shared/Models/Email.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.voiceinbox.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO

  # ---------------------------------------------------------------------------
  # Apple Watch app (modern single-target watchOS app)
  # ---------------------------------------------------------------------------
  VoiceInboxWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aviashkenazi.voiceinbox.watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/VoiceInboxWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        # Watch app icon (required for embedding + App Store validation).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# Declare schemes explicitly so regenerating the project always keeps a
# runnable scheme for the app (and the watch) — Xcode's auto-created schemes
# don't survive `xcodegen generate`.
schemes:
  HearIt:
    build:
      targets:
        HearIt: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VoiceInboxWatch:
    build:
      targets:
        VoiceInboxWatch: all
    run:
      config: Debug
    archive:
      config: Release

